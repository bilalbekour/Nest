<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Puestos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Login -->
  <section id="login" class="flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-lg shadow p-8 w-full max-w-sm">
      <h1 class="text-xl font-bold mb-6 text-center">Reserva de Puestos</h1>
      <form id="login-form" class="space-y-4">
        <input id="login-user" type="text" placeholder="Usuario" required
               class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300">
        <input id="login-pass" type="password" placeholder="Contraseña" required
               class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300">
        <p id="login-error" class="text-red-500 text-sm hidden"></p>
        <button type="submit" class="w-full bg-blue-600 text-white rounded py-2 hover:bg-blue-700">Entrar</button>
      </form>
    </div>
  </section>

  <!-- Nav -->
  <nav id="nav" class="hidden bg-white shadow px-4 py-3 flex items-center justify-between">
    <span class="font-bold text-blue-700">Nido</span>
    <div class="flex items-center gap-4">
      <span id="nav-user" class="text-sm text-gray-600"></span>
      <button onclick="show('reservar')" class="nav-btn text-sm hover:text-blue-600">Reservar</button>
      <button onclick="show('historico')" class="nav-btn text-sm hover:text-blue-600">Histórico</button>
      <button id="btn-admin" class="nav-btn text-sm hover:text-blue-600 hidden" onclick="show('admin')">Admin</button>
      <button onclick="logout()" class="text-sm text-red-500 hover:text-red-700">Salir</button>
    </div>
  </nav>

  <!-- Reservar -->
  <section id="reservar" class="hidden p-4 max-w-6xl mx-auto">
    <div class="bg-white rounded shadow p-4 mb-4 flex items-end gap-4 flex-wrap">
      <div>
        <label class="block text-sm font-medium mb-1">Fecha</label>
        <input id="fecha" type="date" class="border rounded px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Desde</label>
        <input id="desde" type="time" value="08:00" class="border rounded px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Hasta</label>
        <input id="hasta" type="time" value="19:00" class="border rounded px-3 py-2">
      </div>
      <button onclick="renderPlan()" class="bg-blue-600 text-white rounded px-4 py-2 hover:bg-blue-700">Mostrar plano</button>
    </div>
    <div id="plan" class="flex flex-col gap-6"></div>
  </section>

  <!-- Histórico -->
  <section id="historico" class="hidden p-4 max-w-6xl mx-auto">
    <h2 class="text-lg font-bold mb-4">Histórico</h2>
    <div class="bg-white rounded shadow p-4 mb-4 flex items-end gap-4 flex-wrap">
      <div>
        <label class="block text-sm font-medium mb-1">Desde</label>
        <input id="hist-fecha-desde" type="date" class="border rounded px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Hasta</label>
        <input id="hist-fecha-hasta" type="date" class="border rounded px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Servicio</label>
        <select id="hist-servicio" class="border rounded px-3 py-2"></select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Departamento</label>
        <select id="hist-departamento" class="border rounded px-3 py-2"></select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Tipo</label>
        <select id="hist-tipo" class="border rounded px-3 py-2">
          <option value="">Todos</option>
          <option value="agente">Agente</option>
          <option value="staff">Staff</option>
          <option value="visita">Visita</option>
        </select>
      </div>
      <button onclick="loadHistorico()" class="bg-blue-600 text-white rounded px-4 py-2 hover:bg-blue-700">Filtrar</button>
      <button onclick="limpiarHistorico()" class="px-4 py-2 border rounded hover:bg-gray-100">Limpiar</button>
    </div>
    <div class="bg-white rounded shadow overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-left text-gray-600">
          <tr>
            <th class="px-4 py-2 font-medium">Fecha</th>
            <th class="px-4 py-2 font-medium">Puesto</th>
            <th class="px-4 py-2 font-medium">Desde</th>
            <th class="px-4 py-2 font-medium">Hasta</th>
            <th class="px-4 py-2 font-medium">Tipo</th>
            <th class="px-4 py-2 font-medium">Servicio</th>
            <th class="px-4 py-2 font-medium">Departamento</th>
            <th class="px-4 py-2 font-medium">Reservado por</th>
            <th class="px-4 py-2 font-medium">Estado</th>
          </tr>
        </thead>
        <tbody id="hist-body"></tbody>
      </table>
    </div>
  </section>

  <!-- Admin -->
  <section id="admin" class="hidden p-4 max-w-6xl mx-auto">
    <h2 class="text-lg font-bold mb-4">Administración</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white rounded shadow p-4">
        <h3 class="font-bold mb-3">Servicios</h3>
        <ul id="admin-servicios" class="text-sm mb-3 divide-y"></ul>
        <div class="flex gap-2">
          <input id="admin-serv-nombre" type="text" placeholder="Nombre del servicio"
                 class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300">
          <button onclick="crearServicio()" class="bg-blue-600 text-white rounded px-4 py-2 hover:bg-blue-700">Añadir</button>
        </div>
      </div>
      <div class="bg-white rounded shadow p-4">
        <h3 class="font-bold mb-3">Departamentos</h3>
        <ul id="admin-deptos" class="text-sm mb-3 divide-y"></ul>
        <div class="flex gap-2">
          <input id="admin-dept-nombre" type="text" placeholder="Nombre del departamento"
                 class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300">
          <button onclick="crearDepartamento()" class="bg-blue-600 text-white rounded px-4 py-2 hover:bg-blue-700">Añadir</button>
        </div>
      </div>
    </div>
    <div class="bg-white rounded shadow p-4 mt-4 overflow-x-auto">
      <h3 class="font-bold mb-3">Usuarios</h3>
      <table class="w-full text-sm mb-4">
        <thead class="bg-gray-50 text-left text-gray-600">
          <tr>
            <th class="px-4 py-2 font-medium">Usuario</th>
            <th class="px-4 py-2 font-medium">Nombre</th>
            <th class="px-4 py-2 font-medium">Rol</th>
          </tr>
        </thead>
        <tbody id="admin-usuarios"></tbody>
      </table>
      <div class="flex flex-wrap items-end gap-2">
        <div>
          <label class="block text-sm font-medium mb-1">Username</label>
          <input id="admin-user-username" type="text" class="border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Contraseña</label>
          <input id="admin-user-password" type="password" class="border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Nombre</label>
          <input id="admin-user-nombre" type="text" class="border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Rol</label>
          <select id="admin-user-rol" class="border rounded px-3 py-2">
            <option value="staff">Staff</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button onclick="crearUsuario()" class="bg-blue-600 text-white rounded px-4 py-2 hover:bg-blue-700">Crear</button>
      </div>
    </div>
  </section>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-sm">
      <h3 id="modal-title" class="font-bold mb-4"></h3>
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium mb-1">Puesto</label>
          <select id="modal-puesto" class="w-full border rounded px-3 py-2"></select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Tipo</label>
          <select id="modal-tipo" class="w-full border rounded px-3 py-2">
            <option value="agente">Agente</option>
            <option value="staff">Staff</option>
            <option value="visita">Visita</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Servicio</label>
          <select id="modal-servicio" class="w-full border rounded px-3 py-2"></select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Departamento</label>
          <select id="modal-departamento" class="w-full border rounded px-3 py-2"></select>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeModal()" class="px-4 py-2 border rounded hover:bg-gray-100">Cerrar</button>
        <button onclick="saveReserva()" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Guardar</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
